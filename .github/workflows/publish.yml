name: Publish to Comfy Registry

# Runs when pyproject.toml changes on main (bump `version` there to release),
# or manually from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish custom node to the registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          # Repository secret holding the Comfy Registry publishing API key.
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
